# playlistgen default configuration.
#
# Every value can be overridden with an environment variable of the form
#   PLAYLISTGEN_<SECTION>_<KEY>   (e.g. PLAYLISTGEN_PATHS_AUDIO_DIR=/scratch/jamendo/audio)
# On the SCC, point the path entries at scratch storage this way instead of
# editing this file.

paths:
  # Root for downloaded Jamendo audio (mp3 tree as unpacked by the official
  # download tool: <audio_dir>/<00..99>/<track_id>.mp3).
  audio_dir: data/jamendo/audio
  # Jamendo metadata TSV (autotagging subset).
  metadata_tsv: data/jamendo/autotagging.tsv
  # Where shard .npy files + manifests are written during embedding.
  shards_dir: data/shards
  # Final index: embeddings.npy + tracks.parquet (+ vocab.json).
  index_dir: index
  # CLAP checkpoint download location.
  checkpoint_dir: checkpoints

clap:
  # Recommended music checkpoint from the LAION-CLAP repo
  # (https://huggingface.co/lukewys/laion_clap). Record the exact file here so
  # the index and query sides always agree.
  checkpoint: music_audioset_epoch_15_esc_90.14.pt
  checkpoint_url: https://huggingface.co/lukewys/laion_clap/resolve/main/music_audioset_epoch_15_esc_90.14.pt
  # The music checkpoints require the HTSAT-base audio tower without fusion.
  amodel: HTSAT-base
  enable_fusion: false
  sample_rate: 48000
  # auto = cuda if available, else cpu. Set to mps explicitly to try Apple GPU
  # (some HTSAT ops are flaky on MPS, so it is not auto-selected).
  device: auto

chunking:
  window_seconds: 10.0
  hop_seconds: 10.0
  # How window embeddings are pooled into one track vector: mean | max.
  # Kept as a config option for ablation.
  pooling: mean

embedding:
  shard_size: 500        # tracks per shard (one SGE array task per shard)
  batch_size: 8          # windows per forward pass

retrieval:
  top_n: 200             # candidates retrieved by cosine before re-ranking
  alpha: 0.7             # weight on CLAP cosine similarity
  beta: 0.3              # weight on tag-overlap (Jaccard) score

expansion:
  model: gpt-5.5
  max_tokens: 1024

serve:
  host: 127.0.0.1
  port: 8501
